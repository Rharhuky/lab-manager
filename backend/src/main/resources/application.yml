spring:
  application:
    name: campuslab

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campuslab}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:c2VjcmV0S2V5Rm9yQ2FtcHVzTGFiU3lzdGVtVGhpc0lzQXRMZWFzdDI1NkJpdHNMb25nS2V5}
  expiresIn: ${JWT_EXPIRES_IN:86400}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# Logging
logging:
  level:
    com.campuslab: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL:INFO}
